# Stage 1 — Sparse continued pretraining.
# Trains Qwen 2.5 0.5B-Instruct on the Phase 3 CPT corpus under sink+window
# attention with randomized window per step.

model:
  base: "Qwen/Qwen2.5-0.5B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  attn_implementation: "eager"   # required for custom 4D masks

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM

sparse:
  n_sinks: 4
  windows: [64, 128, 256]   # sampled per batch
  randomize_window: true

data:
  path: "data/processed/phase3_cpt.jsonl"
  text_field: "text"          # raw text for CPT
  max_seq_length: 512

training:
  output_dir: "outputs/heal_cpt"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 25
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 2
  bf16: true
  optim: "paged_adamw_8bit"
  report_to: "none"   # change to "wandb" after `wandb login` in the Colab notebook
  run_name: "mimic-heal-cpt-v0"
  seed: 42
