# Stage 2 — Sparse supervised fine-tuning.
# Trains on instruction-response data under the same sparse-mask regime,
# resuming from the Stage 1 CPT adapter.

model:
  base: "Qwen/Qwen2.5-0.5B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  attn_implementation: "eager"
  resume_adapter_from: "outputs/heal_cpt"   # CPT adapter to start from

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM

sparse:
  n_sinks: 4
  windows: [64, 128, 256]
  randomize_window: true

data:
  path: "data/processed/phase3_sft.jsonl"
  text_field: null              # null = messages format
  max_seq_length: 1024

training:
  output_dir: "outputs/heal_sft"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 25
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 2
  bf16: true
  optim: "paged_adamw_8bit"
  report_to: "none"   # change to "wandb" after `wandb login` in the Colab notebook
  run_name: "mimic-heal-sft-v0"
  seed: 42
