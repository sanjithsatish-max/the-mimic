# Stage 2 full-training config.
# Run on RunPod 4090 spot ($0.34/hr) or comparable.

model:
  base: "Qwen/Qwen2.5-0.5B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM

data:
  path: "data/processed/full.jsonl"
  max_seq_length: 2048

training:
  output_dir: "outputs/full-v1"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 25
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 3
  bf16: true
  optim: "paged_adamw_8bit"
  report_to: "wandb"
  run_name: "mimic-v1.0"
  seed: 42
